plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 33
    ndkVersion '25.0.8775105'

    defaultConfig {
        applicationId 'jp.xenia.emulator'
        // 26 (8.0) - Vulkan plus native AAudio.
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        versionName 'Prototype'
        externalNativeBuild {
            ndkBuild {
                arguments 'NDK_APPLICATION_MK:=../../../build/xenia.Application.mk',
                        'PREMAKE_ANDROIDNDK_PLATFORMS:=Android-ARM64',
                        'PREMAKE_ANDROIDNDK_PLATFORMS+=Android-x86_64',
                        // ndk.jobs doesn't work as of Gradle 7.1.0.
                        "-j${Runtime.runtime.availableProcessors()}",
                        // Work around "Bad file descriptor" on Windows on NDK r22+.
                        '--output-sync=none'
                // For the app, don't build the executables designed for running from a terminal.
                // To build the executables, run ndk-build manually.
                // main_hook/hook_impl are libadrenotools' runtime-dlopen'd hook payload
                // (Turnip loading) — not link-time deps of xenia-app, so they are listed
                // here explicitly so ndk-build builds + packages them (ARM64-only; they are
                // ExcludeFromBuild on x86_64 so naming them on that ABI is a harmless no-op).
                targets 'xenia-app', 'main_hook', 'hook_impl'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
            stl 'c++_static'
        }
    }

    // libadrenotools requires its hook .so (libmain_hook.so / libhook_impl.so) to be
    // EXTRACTED into nativeLibraryDir (the hookLibDir it dlopens from), which only
    // happens with legacy (uncompressed-extracted) jniLibs packaging. Without this the
    // hook payload is read directly from the APK and Turnip loading fails (then falls
    // back to the system driver). Harmless for the default system-driver path.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        release {
            externalNativeBuild {
                ndkBuild {
                    arguments 'PREMAKE_ANDROIDNDK_CONFIGURATIONS:=Release'
                }
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            debuggable true
            externalNativeBuild {
                ndkBuild {
                    arguments 'PREMAKE_ANDROIDNDK_CONFIGURATIONS:=Debug'
                }
            }
        }
        checked {
            applicationIdSuffix '.checked'
            debuggable true
            externalNativeBuild {
                ndkBuild {
                    arguments 'PREMAKE_ANDROIDNDK_CONFIGURATIONS:=Checked'
                }
            }
        }
    }

    flavorDimensions 'distribution'
    productFlavors {
        github {
            dimension 'distribution'
            applicationIdSuffix '.github'
        }
        googlePlay {
            dimension 'distribution'
            // TODO(Triang3l): Provide a signing config for core contributors only.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path file('../../../build/xenia.wks.Android.mk')
        }
    }
}

dependencies {
    implementation 'org.jetbrains:annotations:15.0'
}
